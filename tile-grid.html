<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MOSAIC — 이어붙인 3D 이미지</title>
<style>
  /* ===== 2026-06-01 호윤 포폴 : 3D 타일 그리드 (큰 이미지를 타일로 쪼개 입체로) ===== */
  @font-face{font-family:'Pretendard';src:url('https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/woff2/Pretendard-Regular.woff2') format('woff2');font-weight:400;font-display:swap;}
  @font-face{font-family:'Pretendard';src:url('https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/woff2/Pretendard-Bold.woff2') format('woff2');font-weight:700;font-display:swap;}
  @font-face{font-family:'Pretendard';src:url('https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/woff2/Pretendard-Black.woff2') format('woff2');font-weight:900;font-display:swap;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;font-family:'Pretendard',sans-serif;color:#fff;
    background:radial-gradient(ellipse at 50% 40%,#161427 0%,#0a0913 60%,#050409 100%);}
  #scene{position:fixed;inset:0;z-index:1;display:block;}

  .ui{position:fixed;inset:0;z-index:2;pointer-events:none;}
  .brand{position:absolute;top:30px;left:40px;font-weight:900;letter-spacing:5px;font-size:20px;text-shadow:0 2px 30px rgba(0,0,0,.9);}
  .brand small{display:block;font-weight:400;letter-spacing:3px;font-size:11px;opacity:.55;margin-top:6px;}
  .badge{position:absolute;top:30px;right:40px;font-size:11px;letter-spacing:2px;opacity:.5;text-align:right;}

  .panel{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);
    display:flex;align-items:center;gap:18px;padding:14px 20px;border-radius:18px;
    background:rgba(18,20,30,.55);border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);pointer-events:auto;box-shadow:0 18px 60px rgba(0,0,0,.5);}
  .panel label.btn{display:flex;align-items:center;gap:8px;padding:12px 18px;border-radius:12px;cursor:pointer;
    font-size:13px;font-weight:700;border:1.5px solid rgba(255,255,255,.2);transition:.25s;}
  .panel label.btn:hover{border-color:#7af6ff;color:#7af6ff;background:rgba(122,246,255,.06);}
  .panel input[type=file]{display:none;}
  .ctrl{display:flex;flex-direction:column;gap:5px;font-size:11px;color:rgba(255,255,255,.6);}
  .ctrl input[type=range]{width:120px;accent-color:#7af6ff;}
  .sep{width:1px;height:44px;background:rgba(255,255,255,.12);}

  #drophint{position:fixed;inset:14px;z-index:5;border:2px dashed #7af6ff;border-radius:20px;
    background:rgba(122,246,255,.08);display:none;place-items:center;font-size:20px;font-weight:700;color:#7af6ff;}
  #drophint.show{display:grid;}
</style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="ui">
    <div class="brand">MOSAIC<small>이어붙인 3D 이미지 · MOVE / SCROLL</small></div>
    <div class="badge">3D TILE GRID</div>
    <div class="panel">
      <label class="btn" for="fileImg">🖼 사진 올리기</label>
      <input type="file" id="fileImg" accept="image/*" />
      <div class="sep"></div>
      <div class="ctrl"><span>타일 간격</span><input type="range" id="gap" min="0" max="100" value="30" /></div>
      <div class="ctrl"><span>입체 강도</span><input type="range" id="depth" min="0" max="100" value="45" /></div>
    </div>
  </div>
  <div id="drophint">여기에 놓으세요</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0,0,6);

const group = new THREE.Group();
scene.add(group);

// 설정값
const cfg = { gapFactor:0.06, depth:1.0 };
let tiles = [];

// 기본 데모 이미지 (그라데이션 + 도형)
function demoCanvas(){
  const c=document.createElement('canvas'); c.width=1200; c.height=800; const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,1200,800);
  g.addColorStop(0,'#5b8cff'); g.addColorStop(.5,'#a45bff'); g.addColorStop(1,'#ff5ea8');
  x.fillStyle=g; x.fillRect(0,0,1200,800);
  for(let i=0;i<7;i++){ x.beginPath(); x.fillStyle=`rgba(255,255,255,${0.04+i*0.02})`;
    x.arc(200+i*150, 150+(i%3)*230, 120-i*8, 0, Math.PI*2); x.fill(); }
  x.fillStyle='#fff'; x.font='900 84px Pretendard,sans-serif'; x.textAlign='center';
  x.fillText('DROP IMAGE', 600, 430);
  return c;
}
function makeTex(src, srgb){
  const t = new THREE.Texture(src);
  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  t.minFilter = THREE.LinearFilter; t.magFilter = THREE.LinearFilter; t.generateMipmaps=false;
  t.needsUpdate = true; return t;
}

function buildGrid(baseTex, aspect){
  // 기존 정리
  tiles.forEach(t=>{ t.mesh.geometry.dispose(); t.mesh.material.map.dispose(); t.mesh.material.dispose(); });
  group.clear(); tiles = [];

  const gridH = 4.2;
  const gridW = gridH * aspect;
  const rows = 6;
  const cols = Math.max(3, Math.round(rows * aspect));
  const tileW = gridW/cols, tileH = gridH/rows;

  for(let j=0;j<rows;j++){
    for(let i=0;i<cols;i++){
      const tex = baseTex.clone(); tex.needsUpdate = true;
      tex.colorSpace = baseTex.colorSpace;
      tex.repeat.set(1/cols, 1/rows);
      tex.offset.set(i/cols, 1 - (j+1)/rows);
      const mat = new THREE.MeshBasicMaterial({ map: tex });
      const geo = new THREE.PlaneGeometry(tileW, tileH);
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(-gridW/2 + (i+0.5)*tileW, gridH/2 - (j+0.5)*tileH, 0);
      group.add(mesh);
      tiles.push({ mesh, ix:i, iy:j, baseX:mesh.position.x, baseY:mesh.position.y, phase:(i*0.6+j*0.9) });
    }
  }
  group.userData.gridW = gridW; group.userData.gridH = gridH;
  group.userData.tileW = tileW; group.userData.tileH = tileH;
  updateGaps();
}
function updateGaps(){
  const sx = 1 - cfg.gapFactor, sy = 1 - cfg.gapFactor;
  tiles.forEach(t=> t.mesh.scale.set(sx, sy, 1));
}

// 초기 데모
let curAspect = 1.5;
buildGrid(makeTex(demoCanvas(), true), curAspect);
// picsum 시도 (실패해도 데모 유지)
(()=>{ const img=new Image(); img.crossOrigin='anonymous';
  img.onload=()=>{ curAspect=img.width/img.height; buildGrid(makeTex(img,true), curAspect); };
  img.onerror=()=>{};
  img.src='https://picsum.photos/seed/aura7/1200/800';
})();

// ---- 인터랙션 ----
const target = new THREE.Vector2(0,0);
const ptr = new THREE.Vector2(0,0);
addEventListener('pointermove', e=>{
  target.x=(e.clientX/innerWidth)*2-1; target.y=-((e.clientY/innerHeight)*2-1);
});
let scrollY = 0;
addEventListener('wheel', e=>{ scrollY += e.deltaY*0.0008; }, {passive:true});

const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  ptr.lerp(target, 0.06);

  // 그룹 전체 살짝 기울이기 (마우스 패럴랙스)
  group.rotation.y += (ptr.x*0.35 - group.rotation.y)*0.05;
  group.rotation.x += (-ptr.y*0.28 - group.rotation.x)*0.05;

  const gw = group.userData.gridW||6, gh = group.userData.gridH||4;
  const px = ptr.x*gw*0.5, py = ptr.y*gh*0.5;

  tiles.forEach(tl=>{
    // 커서 근처 타일이 앞으로 튀어나옴 + 잔잔한 물결
    const dx = tl.baseX-px, dy = tl.baseY-py;
    const dist = Math.sqrt(dx*dx+dy*dy);
    const pop = Math.exp(-dist*dist*0.25) * 1.1 * cfg.depth;
    const wave = Math.sin(t*1.1 + tl.phase) * 0.06 * cfg.depth;
    const targetZ = pop + wave + Math.sin(scrollY*3 + tl.phase)*0.15*cfg.depth;
    tl.mesh.position.z += (targetZ - tl.mesh.position.z)*0.1;
    // 튀어나온 타일 살짝 더 큼
    const sc = (1-cfg.gapFactor) * (1 + Math.max(0,pop)*0.05);
    tl.mesh.scale.x += (sc - tl.mesh.scale.x)*0.1;
    tl.mesh.scale.y += (sc - tl.mesh.scale.y)*0.1;
  });

  camera.position.x += (ptr.x*0.5 - camera.position.x)*0.04;
  camera.position.y += (ptr.y*0.4 - camera.position.y)*0.04;
  camera.lookAt(0,0,0);

  renderer.render(scene, camera);
}
animate();

addEventListener('resize', ()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---- 파일 로딩 ----
function loadFile(file){
  const url=URL.createObjectURL(file); const img=new Image();
  img.onload=()=>{ curAspect=img.width/img.height; buildGrid(makeTex(img,true), curAspect); URL.revokeObjectURL(url); };
  img.src=url;
}
document.getElementById('fileImg').addEventListener('change', e=> e.target.files[0] && loadFile(e.target.files[0]));
const dh=document.getElementById('drophint'); let dc=0;
addEventListener('dragenter', e=>{e.preventDefault();dc++;dh.classList.add('show');});
addEventListener('dragover', e=>e.preventDefault());
addEventListener('dragleave', ()=>{dc--; if(dc<=0)dh.classList.remove('show');});
addEventListener('drop', e=>{ e.preventDefault();dc=0;dh.classList.remove('show');
  const f=[...e.dataTransfer.files].find(f=>f.type.startsWith('image/')); if(f) loadFile(f); });

// 슬라이더
document.getElementById('gap').addEventListener('input', e=>{ cfg.gapFactor=(e.target.value/100)*0.18; updateGaps(); });
document.getElementById('depth').addEventListener('input', e=>{ cfg.depth=(e.target.value/100)*2.2; });
</script>
</body>
</html>
